<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — VatanParvar Yaypan</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo-mark.svg">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-bg text-text min-h-screen flex items-center justify-center p-6">
    <div class="aurora" aria-hidden="true"><div class="blob"></div></div>

    <div class="max-w-md text-center">
        <div class="w-24 h-24 mx-auto mb-6 rounded-3xl grad-bg-soft flex items-center justify-center text-5xl">
            📡
        </div>
        <h1 class="text-3xl font-display font-extrabold mb-3">
            Internet <span class="grad-text">yo'q</span>
        </h1>
        <p class="text-muted mb-6 leading-relaxed">
            Internet aloqasi uzilgan. Keshlangan sahifalar ishlaydi, lekin yangi ma'lumotlar uchun internet kerak.
        </p>
        <button onclick="location.reload()" class="btn btn-primary">
            🔄 Qayta urinish
        </button>
        <p class="text-xs text-muted mt-6">
            Tarmoq qaytarilsa, bu sahifa avtomatik yopiladi.
        </p>
    </div>

    <script>
        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>
</html>
