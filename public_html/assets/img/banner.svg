<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="bn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B1024"/>
            <stop offset="50%" stop-color="#1E0B36"/>
            <stop offset="100%" stop-color="#3F0B30"/>
        </linearGradient>
        <radialGradient id="bn-glow1" cx="20%" cy="30%" r="40%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bn-glow2" cx="80%" cy="70%" r="40%">
            <stop offset="0%" stop-color="#EC4899" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bn-glow3" cx="55%" cy="50%" r="35%">
            <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bn-line" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06B6D4"/>
            <stop offset="50%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#EC4899"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="600" fill="url(#bn-bg)"/>
    <rect width="1200" height="600" fill="url(#bn-glow1)"/>
    <rect width="1200" height="600" fill="url(#bn-glow2)"/>
    <rect width="1200" height="600" fill="url(#bn-glow3)"/>

    <g opacity="0.4" stroke="#FFFFFF" stroke-width="1">
        <line x1="0" y1="120" x2="1200" y2="120" stroke-opacity="0.05"/>
        <line x1="0" y1="240" x2="1200" y2="240" stroke-opacity="0.05"/>
        <line x1="0" y1="360" x2="1200" y2="360" stroke-opacity="0.05"/>
        <line x1="0" y1="480" x2="1200" y2="480" stroke-opacity="0.05"/>
        <line x1="200" y1="0" x2="200" y2="600" stroke-opacity="0.05"/>
        <line x1="400" y1="0" x2="400" y2="600" stroke-opacity="0.05"/>
        <line x1="600" y1="0" x2="600" y2="600" stroke-opacity="0.05"/>
        <line x1="800" y1="0" x2="800" y2="600" stroke-opacity="0.05"/>
        <line x1="1000" y1="0" x2="1000" y2="600" stroke-opacity="0.05"/>
    </g>

    <g transform="translate(880,180)">
        <rect x="-90" y="-50" width="180" height="100" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <circle cx="-50" cy="0" r="22" fill="#EF4444"/>
        <circle cx="0" cy="0" r="22" fill="#FBBF24"/>
        <circle cx="50" cy="0" r="22" fill="#10B981"/>
        <circle cx="-50" cy="0" r="22" fill="#FFFFFF" fill-opacity="0.18"/>
    </g>

    <g transform="translate(960,440)">
        <polygon points="0,-70 70,40 -70,40" fill="#FBBF24"/>
        <polygon points="0,-55 55,30 -55,30" fill="#0B1024"/>
        <text x="0" y="20" text-anchor="middle" font-family="Arial Black" font-size="48" fill="#FBBF24" font-weight="900">!</text>
    </g>

    <path d="M0,540 Q300,500 600,520 T1200,500 L1200,600 L0,600 Z" fill="#0B1024" fill-opacity="0.6"/>
    <path d="M0,540 Q300,500 600,520 T1200,500" stroke="url(#bn-line)" stroke-width="3" fill="none" opacity="0.7"/>

    <g stroke="#FBBF24" stroke-width="6" stroke-dasharray="40 30">
        <path d="M0,560 Q300,525 600,540 T1200,520" fill="none"/>
    </g>

    <g transform="translate(160,360)">
        <rect x="-110" y="-50" width="220" height="80" rx="40" fill="#06B6D4"/>
        <rect x="-90" y="-50" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.7"/>
        <rect x="-30" y="-50" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.7"/>
        <rect x="30" y="-50" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.7"/>
        <circle cx="-70" cy="40" r="22" fill="#0B1024" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="70" cy="40" r="22" fill="#0B1024" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="-110" cy="-15" r="6" fill="#FBBF24"/>
        <circle cx="110" cy="-15" r="6" fill="#EF4444"/>
